id: IRISH-LANGUAGE-MEANING-PRESERVATION
version: 0.2.0
status: active-research-front
kind: operational-object
source_authority:
  repository: EduLinked-Systems/metadata-sovereignty-ai-research
  rule: source-language-first
principle: "Translate representations; do not translate away the source ontology."
canonical_model:
  sequence:
    - source_language_expression
    - source_language_concept_identity
    - provenance_and_authority
    - dialect_and_register
    - governed_multilingual_mappings
    - accessible_projections
  prohibition: "English MUST NOT silently become the canonical epistemic pivot."
required_metadata:
  - source_language
  - source_expression
  - concept_identity
  - dialect_or_variety
  - register
  - source_creator_or_community
  - source_uri_or_identifier
  - authority_basis
  - transformation_history
  - translator_or_model
  - mapping_confidence
  - semantic_loss_warning
  - consent_or_reuse_constraints
  - supersession_state
semantic_erasure_risks:
  dialect_flattening: "Distinct Irish varieties are normalised into one representation."
  concept_flattening: "A situated Irish concept is replaced by its nearest English lexical equivalent."
  synthetic_legitimacy: "Generated Irish appears linguistically plausible while introducing unsupported forms or meaning."
  entity_distortion: "Names, places, institutions or culturally situated entities are damaged during extraction or mapping."
  provenance_severance: "A claim survives transformation while its source, language, speaker/community or authority is lost."
  epistemic_pivoting: "A translation becomes canonical and the source language becomes a display label."
  authority_loss: "Model-generated interpretation is treated as equivalent to source/community authority."
validation:
  source_language_preserved: required
  provenance_chain_preserved: required
  semantic_loss_assessed: required
  model_self_certification_sufficient: false
  source_language_human_review:
    required_for: [high_risk_claims, canonical_concepts, disputed_mappings]
provenance_policy:
  corrected_claims: "Retain prior evidence and mark SUPERSEDED with successor binding; do not silently overwrite provenance."
  external_frameworks: "Reuse machine-operable provenance patterns where legitimate; do not treat Indigenous governance frameworks and Irish historical/community contexts as interchangeable."
accessibility_authority_binding:
  rule: "Accessible projection is a governed derivative of the source-language meaning, not a new source ontology or proof of accessibility."
  source_authorities:
    - repository: EduLinked-Pty-Ltd/core-machine-objects
      path: objects/education/easy-read-adaptive-instructional-composition-v0.1.json
      role: EASY_READ_SEMANTIC_AND_COMPOSITION_AUTHORITY
    - repository: EduLinked-Pty-Ltd/core-machine-objects
      path: objects/accessibility-capability-layer/contracts/accessible-document-lifecycle-v1.json
      role: SOURCE_PRESERVING_REQUIREMENT_TRANSFORMATION_VERIFICATION_EXPORT_AND_OUTCOME_BOUNDARY
    - repository: EduLinked-Systems/edulinked-accessibility-system
      path: adapters/easy-read/entrypoints.yaml
      role: CURRENT_EASY_READ_IMPLEMENTATION_AND_NAVIGATION_PROJECTION
    - repository: EduLinked-Pty-Ltd/accessible-RTO
      path: templates/inclusive-learning-production-standard.md
      version: 1.2.0
      role: INCLUSIVE_PRODUCTION_AND_LANGUAGE_LOCALISATION_REQUIREMENTS
  explicit_non_use:
    - repository: EduLinked-Systems/easy-read
      state: NO_OP_FOR_PRODUCTION_CONSUMPTION
      reason: "Source-owned issue #1 remains an open authority-proof gate; successor boundary != proven production implementation."
  requirement_rule: "Do not infer Easy Read, symbol, AAC, signed-language, translation/localisation or other modality preference from availability alone; bind an attributable person/cohort/purpose requirement or retain UNKNOWN."
  language_rule: "Translation and accessibility transformation must preserve the Gaeilge source, source-language concept identity, dialect/register metadata and transformation lineage."
  verification_rule: "Machine generation or checking cannot self-certify semantic preservation, accessibility conformance, cultural localisation or participant comprehension."
easy_read_follow_up:
  state: planned_not_produced
  symbol_supported_candidate: true
  modality_selection_requires_attributable_need: true
  source_language_must_remain_attached: true
  priority_objects:
    - title: "AI can speak Irish and still get Irish wrong"
      purpose: distinguish fluent appearance from preserved meaning
    - title: "Where did this knowledge come from?"
      purpose: show source/community -> Gaeilge source -> concept -> mappings -> outputs with provenance at every transformation
    - title: "Translation should not erase the original"
      purpose: explain why Gaeilge, dialect and source remain attached to accessible and multilingual projections
  production_route: "Use the existing Core accessibility lifecycle and Accessibility System entrypoints when a bounded real consumer/access requirement exists; do not create repository-local Easy Read/AAC production architecture."
claim_boundaries:
  - TRANSLATION_REQUESTED != TRANSLATION_COMPLETE
  - MACHINE_DRAFT_ONLY != LINGUISTICALLY_VERIFIED
  - TRANSLATED_TEXT != CULTURALLY_LOCALISED
  - SOURCE_LANGUAGE_PRESERVED != SEMANTIC_PRESERVATION_VERIFIED
  - PLAIN_LANGUAGE != EASY_READ
  - SYMBOLS_PRESENT != AAC
  - ACCESSIBILITY_OPTION_AVAILABLE != PARTICIPANT_PREFERENCE
  - AI_GENERATED != ACCESSIBLE
  - AUTOMATED_CHECK != ACCESSIBILITY_CONFORMANCE
  - MATERIALISATION != PARTICIPANT_COMPREHENSION
  - ACCESSIBILITY_VERIFICATION != PARTICIPATION_OUTCOME
research_watch:
  active: true
  priorities:
    - Gaeilge-first scholarship
    - Irish NLP and LLM evaluation
    - multilingual ontology and knowledge representation
    - anti-colonial provenance
    - data sovereignty and machine-operable cultural authority
    - semantic erasure and translation loss
machine_readable_continuation:
  workflow: "DISCOVER -> REUSE -> BIND -> CONFIGURE -> COMPOSE -> EXTEND -> CREATE ONLY IF REQUIRED"
  completed_in_this_revision:
    - bound accessible projections to current Core, Accessibility System and AccessFlow authorities
    - removed any implication that symbol support is an already-selected participant modality
    - separated machine generation, semantic preservation, accessibility verification and participant comprehension claims
  next_actions:
    - bind empirical Irish-language benchmarks as evidence objects
    - bind source-language scholarship without replacing Gaeilge titles or terminology
    - map applicable provenance standards and protocols with explicit claim ceilings
    - when a real bounded consumer/access requirement exists, produce the priority accessible projection through the existing accessibility lifecycle and retain human/source-language review gates
    - test existing ontology and AI objects for epistemic-pivot and provenance-severance risk
